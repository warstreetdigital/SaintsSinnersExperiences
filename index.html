<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saints n’ Sinners | Premium Nightlife</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="loader">
      <div class="loader-content">
        <h2 class="loader-logo">Saints <span>n’</span> Sinners</h2>
        <div class="loader-bar"></div>
      </div>
    </div>

    <div class="atmosphere"></div>
    <div class="particles" id="particles"></div>
    <div class="glow-effect"></div>

    <div class="container">
      <header>
        <h1 class="logo">Saints <span>n’</span> Sinners</h1>
        <p class="tagline">• RESTAURANT • LOUNGE • PUB</p>
        <div class="rating">🌟🌟🌟🌟🌟</div>

      <main class="nav-grid">
        <div class="nav-card-wrapper">
          <div class="nav-card card-menu" id="menu" onclick="window.location.href='https://saints-sinnersdigitalmenu.pages.dev/'">
            <div class="glow-layer"></div>
            <span class="card-index">01</span>
            <h2 class="card-title">
              Menu
              <span class="arrow">→</span>
            </h2>
          </div>
        </div>

        <div class="nav-card-wrapper">
          <div class="nav-card card-events" id="events" onclick="window.location.href='events.html'">
            <div class="glow-layer"></div>
            <span class="card-index">02</span>
            <h2 class="card-title">
              Events
              <span class="arrow">→</span>
            </h2>
          </div>
        </div>

        <div class="nav-card-wrapper">
          <div class="nav-card card-playlist" id="playlist" onclick="window.location.href='music.html'">
            <div class="glow-layer"></div>
            <span class="card-index">03</span>
            <h2 class="card-title">
              Playlist
              <span class="arrow">→</span>
            </h2>
          </div>
        </div>

        <div class="nav-card-wrapper">
          <div class="nav-card card-management" id="management" onclick="window.location.href='management.html'">
            <div class="glow-layer"></div>
            <span class="card-index">04</span>
            <h2 class="card-title">
              Management
              <span class="arrow">→</span>
            </h2>
          </div>
        </div>
      </main>

      <footer class="footer">
        <p class="copyright">© 2026 Saints n’ Sinners</p>
        <p class="powered-by">Powered by WarStreet Experience Model</p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
