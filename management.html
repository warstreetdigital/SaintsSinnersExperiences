<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saints n’ Sinners | Executive Lounge</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        :root {
            --accent-gold: #ffcc33;
            --accent-green: #25D366;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        /* Ambient Environment */
        .management-atmosphere {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 10%, rgba(255, 204, 51, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(255, 204, 51, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.3;
        }

        .mgmt-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        /* Navigation */
        .back-nav {
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: rgba(255, 204, 51, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Header */
        .mgmt-header-section {
            text-align: center;
            margin-bottom: 50px;
            opacity: 1;
        }

        .mgmt-header-section h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .mgmt-header-section p {
            color: var(--accent-gold);
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.8;
            margin: 0;
        }

        /* Management Cards */
        .mgmt-stack {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }

        .mgmt-card {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 25px;
            overflow: hidden;
            background: #111;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.6s ease;
        }

        .mgmt-card.dominant {
            height: 520px;
            border-color: rgba(255, 204, 51, 0.3);
        }

        /* Portrait Motion Container */
        .portrait-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .portrait-img {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background-size: cover;
            background-position: center 20%;
            filter: brightness(0.9) contrast(1.1);
            will-change: transform;
        }

        /* Lighting & Depth Layers */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 70%);
            z-index: 1;
        }

        .light-sweep {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
            background-size: 200% 200%;
            z-index: 2;
            pointer-events: none;
        }

        .haze-layer {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 80%, rgba(255, 204, 51, 0.1) 0%, transparent 60%);
            z-index: 2;
            mix-blend-mode: soft-light;
            pointer-events: none;
        }

        /* Card Content */
        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            z-index: 10;
            text-align: center;
        }

        .mgmt-role {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            display: block;
            text-shadow: 0 0 10px rgba(255, 204, 51, 0.3);
        }

        .mgmt-name {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        /* Button Group */
        .action-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-action {
            flex: 1;
            max-width: 160px;
            height: 50px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-whatsapp {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.5);
        }

        .btn-call {
            background: transparent;
            color: #fff;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 10px 20px rgba(255, 204, 51, 0.1);
        }

        .btn-call::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }

        .btn-call:hover::before {
            left: 100%;
        }

        .btn-call:hover {
            background: rgba(255, 204, 51, 0.1);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 204, 51, 0.2);
        }

        /* Pulse Animations */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .dominant .mgmt-role {
            animation: subtlePulse 3s infinite ease-in-out;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .mgmt-card {
                height: 440px;
            }
            .mgmt-card.dominant {
                height: 480px;
            }
            .mgmt-name {
                font-size: 1.4rem;
            }
            .btn-action {
                font-size: 0.75rem;
                padding: 0 15px;
            }
        }
    </style>
</head>
