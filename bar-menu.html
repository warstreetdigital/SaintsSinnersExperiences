<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saints n’ Sinners | Executive Bar Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <style>
        :root {
            --accent-gold: #ffcc33;
            --accent-gold-bright: #ffe066;
            --accent-gold-dark: #cca329;
            --bg-dark: #050505;
            --card-bg: rgba(18, 18, 18, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-gold: rgba(255, 204, 51, 0.25);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(45, 35, 10, 0.45) 0%, transparent 65%),
                radial-gradient(circle at 85% 90%, rgba(25, 20, 5, 0.35) 0%, transparent 50%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 110px;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        .bar-atmosphere {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.25;
        }

        .bar-container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 24px 20px;
            position: relative;
            z-index: 10;
        }

        /* Navigation Header */
        .nav-bar-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: #ccc;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: rgba(255, 204, 51, 0.12);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        /* Header */
        .bar-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .bar-header p {
            color: var(--accent-gold);
            font-size: 0.68rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .bar-header h1 {
            font-family: var(--font-serif);
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, #d1d1d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.15;
        }

        .bar-header-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            margin: 12px auto 0 auto;
            opacity: 0.6;
        }

        /* Search Control */
        .search-container {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 13px 20px 13px 46px;
            background: rgba(20, 20, 20, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #fff;
            font-size: 0.88rem;
            font-family: var(--font-sans);
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            background: rgba(28, 28, 28, 0.85);
            box-shadow: 0 0 18px rgba(255, 204, 51, 0.18), inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            opacity: 0.8;
            font-size: 0.95rem;
            pointer-events: none;
        }

        /* Category Filter Tabs Rail */
        .category-rail-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 6px 12px 6px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .subcat-pills-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 4px 4px 4px;
            margin-top: 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .subcat-pills-wrapper::-webkit-scrollbar {
            display: none;
        }
        .subcat-pill-btn {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 204, 51, 0.2);
            border-radius: 20px;
            color: #bbb;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }
        .subcat-pill-btn:hover {
            color: #fff;
            border-color: rgba(255, 204, 51, 0.5);
            background: rgba(255, 204, 51, 0.08);
        }
        .subcat-pill-btn.active {
            background: rgba(255, 204, 51, 0.18);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(255, 204, 51, 0.15);
        }
        .price-badge.price-tbc {
            color: #aaa;
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            font-size: 0.75rem;
        }

        .tab-btn {
            white-space: nowrap;
            padding: 9px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .tab-btn:hover {
            color: #fff;
            border-color: rgba(255, 204, 51, 0.4);
            background: rgba(255, 204, 51, 0.06);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255, 204, 51, 0.22) 0%, rgba(255, 204, 51, 0.08) 100%);
            border-color: var(--accent-gold);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 204, 51, 0.2), inset 0 0 10px rgba(255, 204, 51, 0.1);
        }

        /* Subcategory Section Header */
        .subcategory-title {
            font-family: var(--font-serif);
            font-size: 1.45rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin: 32px 0 16px 0;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 204, 51, 0.2);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subcategory-title:first-of-type {
            margin-top: 0;
        }

        .item-count-badge {
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-sans);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 9px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Drink Grid Layout */
        .drink-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .drink-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 18px;
            position: relative;
            backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .drink-card:hover {
            border-color: rgba(255, 204, 51, 0.38);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0,0,0,0.65);
            background: rgba(25, 25, 25, 0.88);
        }

        .drink-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        .drink-name {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            line-height: 1.25;
            flex: 1;
        }

        .drink-price-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 3px;
            flex-shrink: 0;
            text-align: right;
        }

        .price-line {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            gap: 5px;
            line-height: 1.25;
        }

        .price-label {
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .price-val {
            font-family: var(--font-serif);
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.3px;
        }

        .price-badge {
            font-family: var(--font-serif);
            font-size: 1.12rem;
            color: var(--accent-gold);
            font-weight: 700;
            white-space: nowrap;
            background: rgba(255, 204, 51, 0.1);
            padding: 3px 11px;
            border-radius: 20px;
            border: 1px solid rgba(255, 204, 51, 0.28);
        }

        .price-sub {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .drink-desc {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.62);
            line-height: 1.45;
            font-weight: 300;
            margin-top: 8px;
            font-family: var(--font-sans);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            .bar-container {
                padding: 16px 12px;
            }
            .drink-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .bar-header {
                margin-bottom: 20px;
            }
            .bar-header h1 {
                font-size: 2.1rem;
            }
            .drink-card {
                padding: 14px 16px;
            }
            .drink-name {
                font-size: 1.18rem;
            }
            .nav-bar-group {
                margin-bottom: 18px;
            }
        }

        /* Card Actions & Buttons */
        .drink-actions {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-btn-single {
            width: 100%;
            padding: 8px 14px;
            background: rgba(255, 204, 51, 0.08);
            border: 1px solid rgba(255, 204, 51, 0.28);
            border-radius: 20px;
            color: var(--accent-gold);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .add-btn-single:hover {
            background: rgba(255, 204, 51, 0.22);
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 204, 51, 0.15);
        }

        .add-btn-single:active {
            transform: scale(0.98);
        }

        /* Dual Option Buttons */
        .dual-option-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .add-option-btn {
            flex: 1;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 204, 51, 0.25);
            border-radius: 18px;
            color: var(--accent-gold);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }

        .add-option-btn:hover {
            background: rgba(255, 204, 51, 0.18);
            border-color: var(--accent-gold);
            color: #fff;
        }

        /* Quantity Adjuster on Cards */
        .card-qty-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 204, 51, 0.12);
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            padding: 3px 6px;
            width: 100%;
        }

        .card-qty-control.compact {
            flex: 1;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 204, 51, 0.25);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        .qty-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .qty-count {
            font-size: 0.72rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            padding: 0 4px;
        }

        /* Floating Cart Bar */
        .cart-floating-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 520px;
            background: rgba(15, 15, 15, 0.94);
            border: 1px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 22px rgba(255, 204, 51, 0.2);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 8px 10px 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 99;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-floating-bar.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 30px);
        }

        .cart-bar-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon-wrapper {
            position: relative;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-bar-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 800;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .cart-bar-text {
            display: flex;
            flex-direction: column;
        }

        .cart-bar-title {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-bar-subtotal {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-gold);
            line-height: 1;
        }

        .cart-bar-checkout-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 204, 51, 0.3);
            transition: all 0.2s ease;
        }

        .cart-bar-checkout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 204, 51, 0.45);
        }

        /* Modal Drawer */
        .cart-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .cart-modal-backdrop.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .cart-modal {
            width: 100%;
            max-width: 550px;
            background: #0d0d0d;
            border: 1px solid var(--glass-border-gold);
            border-bottom: none;
            border-radius: 24px 24px 0 0;
            padding: 22px 20px 28px 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.9);
            transform: translateY(0);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-modal-backdrop.hidden .cart-modal {
            transform: translateY(100%);
        }

        .cart-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cart-modal-title h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .cart-modal-title p {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .cart-close-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .cart-close-btn:hover {
            background: rgba(255, 204, 51, 0.2);
            color: var(--accent-gold);
        }

        .cart-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 12px;
            gap: 12px;
        }

        .cart-item-details {
            flex: 1;
            min-width: 0;
        }

        .cart-item-title {
            font-family: var(--font-serif);
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-pricing {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        .cart-item-qty-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .cart-item-total {
            font-family: var(--font-serif);
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--accent-gold);
            min-width: 55px;
            text-align: right;
        }

        .cart-item-remove {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .cart-item-remove:hover {
            color: #ff5555;
        }

        .empty-cart-msg {
            text-align: center;
            padding: 40px 10px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .cart-modal-footer {
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-subtotal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
        }

        // Cart State Management
        let cart = {};

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function formatPrice(str) {
            if (!str) return '';
            return str.replace(/\.00$/, '');
        }

        function parsePrice(priceStr) {
            if (!priceStr) return 0;
            const clean = priceStr.replace(/[^0-9.]/g, '');
            const val = parseFloat(clean);
            return isNaN(val) ? 0 : val;
        }

        function addDrinkByIndex(originalIdx, option, priceStr) {
            const drink = drinksData[originalIdx];
            if (!drink) return;

            const name = drink.name;
            const price = parsePrice(priceStr || drink.price);
            const id = option ? `${name} (${option})` : name;

            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { id, name, option, price, qty: 1 };
            }

            showToast("Added to order");
            updateCartUI();
            renderMenu();
        }

        function updateQuantityById(id, delta) {
            if (cart[id]) {
                cart[id].qty += delta;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                }
                updateCartUI();
                renderMenu();
            }
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            if (!toast || !toastMsg) return;

            toastMsg.textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('visible');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('visible');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 1800);
        }

        function updateCartUI() {
            const items = Object.values(cart);
            let totalQty = 0;
            let subtotal = 0;

            items.forEach(item => {
                totalQty += item.qty;
                subtotal += item.price * item.qty;
            });

            const floatingBar = document.getElementById('cart-floating-bar');
            const badge = document.getElementById('cart-bar-badge');
            const itemsText = document.getElementById('cart-bar-items-text');
            const subtotalText = document.getElementById('cart-bar-subtotal');

            if (totalQty > 0) {
                floatingBar.classList.remove('hidden');
                badge.textContent = totalQty;
                itemsText.textContent = `${totalQty} ${totalQty === 1 ? 'Item' : 'Items'}`;
                subtotalText.textContent = `$${subtotal.toFixed(2)}`;
            } else {
                floatingBar.classList.add('hidden');
                closeCartModal();
            }

            const modalSubtotal = document.getElementById('cart-modal-subtotal');
            if (modalSubtotal) {
                modalSubtotal.textContent = `$${subtotal.toFixed(2)}`;
            }

            renderCartModalItems();
        }

        function renderCartModalItems() {
            const itemsContainer = document.getElementById('cart-modal-items');
            if (!itemsContainer) return;

            const items = Object.values(cart);
            if (items.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="empty-cart-msg">
                        <p>Your order is currently empty.</p>
                        <p style="margin-top: 4px; font-size: 0.78rem; opacity: 0.6;">Select drinks from the menu to start your order.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            items.forEach(item => {
                const lineTotal = item.price * item.qty;
                const displayName = item.option ? `${item.name} (${item.option})` : item.name;
                const safeId = escapeJs(item.id);

                html += `
                    <div class="cart-item-row">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${displayName}</div>
                            <div class="cart-item-pricing">$${item.price.toFixed(2)} each</div>
                        </div>
                        <div class="cart-item-qty-group">
                            <div class="card-qty-control compact">
                                <button class="qty-btn" onclick="updateQuantityById('${safeId}', -1)">−</button>
                                <span class="qty-count">${item.qty}</span>
                                <button class="qty-btn" onclick="updateQuantityById('${safeId}', 1)">+</button>
                            </div>
                            <div class="cart-item-total">$${lineTotal.toFixed(2)}</div>

                        </div>
                    </div>
                `;
            });

            itemsContainer.innerHTML = html;

            const tableNumber = tableInput ? tableInput.value.trim() : '';

            if (!tableNumber) {
                if (tableInput) {

                    tableInput.focus();

                if (errorMsg) {
                    errorMsg.classList.remove('hidden');
                }
                showToast("Please enter your table number.");
                return;

            if (tableInput) tableInput.classList.remove('input-error');
            if (errorMsg) errorMsg.classList.add('hidden');

            const lines = [
                "SAINTS N’ SINNERS — BAR ORDER 🍸",
                "",
                `Table: ${tableNumber}`,
                ""
            ];

            let grandTotal = 0;
            items.forEach(item => {
                const lineTotal = item.price * item.qty;
                grandTotal += lineTotal;
                const nameStr = item.option ? `${item.name} (${item.option})` : item.name;
                lines.push(`${item.qty} × ${nameStr} — $${lineTotal.toFixed(2)}`);
            });

            lines.push("");
            lines.push(`TOTAL — $${grandTotal.toFixed(2)}`);
            lines.push("");
            lines.push("Please confirm my order. Thank you.");

            const fullMessage = lines.join("\n");
            const encodedMessage = encodeURIComponent(fullMessage);
            const whatsappUrl = `https://wa.me/263788235062?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

                case 'shisha': return 'Shisha';
                default: return '';
            }
        }

        function renderSubcategoryPills() {
            const wrapper = document.getElementById('subcat-pills-wrapper');
            if (!wrapper) return;

            if (activeCategory === 'all') {
                wrapper.innerHTML = '';
                wrapper.classList.add('hidden');
                return;
            }

            const subcats = Array.from(new Set(
                drinksData
                    .filter(item => item.category === activeCategory)
                    .map(item => item.subcategory)
            ));

            if (subcats.length <= 1) {
                wrapper.innerHTML = '';
                wrapper.classList.add('hidden');
                return;
            }

            let pillsHtml = `<button class="subcat-pill-btn ${activeSubcategory === 'all' ? 'active' : ''}" data-subcat="all">All ${getCategoryDisplayName(activeCategory)}</button>`;

            subcats.forEach(sc => {
                pillsHtml += `<button class="subcat-pill-btn ${activeSubcategory === sc ? 'active' : ''}" data-subcat="${escapeJs(sc)}">${sc}</button>`;
            });

            wrapper.innerHTML = pillsHtml;
            wrapper.classList.remove('hidden');

            wrapper.querySelectorAll('.subcat-pill-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeSubcategory = btn.getAttribute('data-subcat');
                    renderSubcategoryPills();
                    renderMenu();
                });
            });
        }

        function renderMenu() {
            renderTarget.innerHTML = '';

            // Filter items based on activeCategory, activeSubcategory, and searchQuery
            const filtered = drinksData.filter(item => {
                const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
                const matchesSubcat = activeSubcategory === 'all' || item.subcategory === activeSubcategory;
                const matchesSearch = !searchQuery || 
                    item.name.toLowerCase().includes(searchQuery) ||
                    (item.desc && item.desc.toLowerCase().includes(searchQuery)) ||
                    item.subcategory.toLowerCase().includes(searchQuery) ||
                    (item.price && item.price.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSubcat && matchesSearch;
            });

            if (filtered.length === 0) {
                renderTarget.innerHTML = `<div class="no-results">No drinks found matching "${searchQuery}".</div>`;
                return;
            }

            // Group filtered items by subcategory
            const grouped = {};
            filtered.forEach(item => {
                if (!grouped[item.subcategory]) {
                    grouped[item.subcategory] = [];
                }
                grouped[item.subcategory].push(item);
            });

            // Render each subcategory section
            Object.keys(grouped).forEach(subcatName => {
                const subSection = document.createElement('div');
                
                const titleHtml = `<h2 class="subcategory-title">
                    <span>${subcatName}</span>
                    <span class="item-count-badge">${grouped[subcatName].length} ${grouped[subcatName].length === 1 ? 'ITEM' : 'ITEMS'}</span>
                </h2>`;

                let cardsHtml = '<div class="drink-grid">';
                grouped[subcatName].forEach(drink => {
                    const originalIdx = drinksData.indexOf(drink);

                    let priceHtml = '';
                    if (drink.shotPrice && drink.btlPrice) {
                        priceHtml = `
                            <div class="drink-price-group">
                                <div class="price-line"><span class="price-label">Shot —</span> <span class="price-val">${formatPrice(drink.shotPrice)}</span></div>
                                <div class="price-line"><span class="price-label">Full Bottle —</span> <span class="price-val">${formatPrice(drink.btlPrice)}</span></div>
                            </div>
                        `;
                    } else if (drink.btlPrice) {
                        priceHtml = `
                            <div class="drink-price-group">
                                <div class="price-line"><span class="price-label">Full Bottle —</span> <span class="price-val">${formatPrice(drink.btlPrice)}</span></div>
                            </div>
                        `;
                    } else if (drink.shotPrice) {
                        priceHtml = `
                            <div class="drink-price-group">
                                <div class="price-line"><span class="price-label">Shot —</span> <span class="price-val">${formatPrice(drink.shotPrice)}</span></div>
                            </div>
                        `;
                    } else if (drink.price === 'Price TBC') {
                        priceHtml = `
                            <div class="drink-price-group">
                                <span class="price-badge price-tbc">Price TBC</span>
                            </div>
                        `;
                    } else {
                        priceHtml = `
                            <div class="drink-price-group">
                                <span class="price-badge">${formatPrice(drink.price)}</span>
                            </div>
                        `;
                    }

                    // Build ordering action buttons for this drink
                    let actionsHtml = '';
                    if (drink.shotPrice && drink.btlPrice) {
                        const shotId = `${drink.name} (Shot)`;
                        const btlId = `${drink.name} (Bottle)`;
                        const shotQty = cart[shotId] ? cart[shotId].qty : 0;
                        const btlQty = cart[btlId] ? cart[btlId].qty : 0;

                        const shotCtrl = shotQty > 0 ? `
                            <div class="card-qty-control compact">
                                <button class="qty-btn" onclick="updateQuantityById('${escapeJs(shotId)}', -1)">−</button>
                                <span class="qty-count">Shot × ${shotQty}</span>
                                <button class="qty-btn" onclick="updateQuantityById('${escapeJs(shotId)}', 1)">+</button>
                            </div>
                        ` : `
                            <button class="add-option-btn" onclick="addDrinkByIndex(${originalIdx}, 'Shot', '${drink.shotPrice}')">+ Shot (${formatPrice(drink.shotPrice)})</button>
                        `;

                        const btlCtrl = btlQty > 0 ? `
                            <div class="card-qty-control compact">
                                <button class="qty-btn" onclick="updateQuantityById('${escapeJs(btlId)}', -1)">−</button>
                                <span class="qty-count">Btl × ${btlQty}</span>
                                <button class="qty-btn" onclick="updateQuantityById('${escapeJs(btlId)}', 1)">+</button>
                            </div>
                        ` : `
                            <button class="add-option-btn" onclick="addDrinkByIndex(${originalIdx}, 'Bottle', '${drink.btlPrice}')">+ Bottle (${formatPrice(drink.btlPrice)})</button>
                        `;

                        actionsHtml = `
                            <div class="drink-actions">
                                <div class="dual-option-row">
                                    ${shotCtrl}
                                    ${btlCtrl}
                                </div>
                            </div>
                        `;
                    } else if (drink.btlPrice && !drink.shotPrice) {
                        const btlId = `${drink.name} (Bottle)`;
                        const btlQty = cart[btlId] ? cart[btlId].qty : 0;

                        if (btlQty > 0) {
                            actionsHtml = `
                                <div class="drink-actions">
                                    <div class="card-qty-control">
                                        <button class="qty-btn" onclick="updateQuantityById('${escapeJs(btlId)}', -1)">−</button>
                                        <span class="qty-count">${btlQty} Bottle in order</span>
                                        <button class="qty-btn" onclick="updateQuantityById('${escapeJs(btlId)}', 1)">+</button>
                                    </div>
                                </div>
                            `;
                        } else {
                            actionsHtml = `
                                <div class="drink-actions">
                                    <button class="add-btn-single" onclick="addDrinkByIndex(${originalIdx}, 'Bottle', '${drink.btlPrice}')">
                                        <span>+</span> Add Full Bottle (${formatPrice(drink.btlPrice)})
                                    </button>
                                </div>
                            `;
                        }
                    } else if (drink.shotPrice && !drink.btlPrice) {
                        const shotId = `${drink.name} (Shot)`;
                        const shotQty = cart[shotId] ? cart[shotId].qty : 0;

                        if (shotQty > 0) {
                            actionsHtml = `
                                <div class="drink-actions">
                                    <div class="card-qty-control">
                                        <button class="qty-btn" onclick="updateQuantityById('${escapeJs(shotId)}', -1)">−</button>
                                        <span class="qty-count">${shotQty} Shot in order</span>
                                        <button class="qty-btn" onclick="updateQuantityById('${escapeJs(shotId)}', 1)">+</button>
                                    </div>
                                </div>
                            `;
                        } else {
                            actionsHtml = `
                                <div class="drink-actions">
                                    <button class="add-btn-single" onclick="addDrinkByIndex(${originalIdx}, 'Shot', '${drink.shotPrice}')">
                                        <span>+</span> Add Shot (${formatPrice(drink.shotPrice)})
                                    </button>
                                </div>
                            `;
                        }
                    } else {
                        const itemId = drink.name;
                        const qty = cart[itemId] ? cart[itemId].qty : 0;

                        if (qty > 0) {
                            actionsHtml = `
                                <div class="drink-actions">
                                    <div class="card-qty-control">
                                        <button class="qty-btn" onclick="updateQuantityById('${escapeJs(itemId)}', -1)">−</button>
                                        <span class="qty-count">${qty} in order</span>
                                        <button class="qty-btn" onclick="updateQuantityById('${escapeJs(itemId)}', 1)">+</button>
                                    </div>
                                </div>
                            `;
                        } else {
                            actionsHtml = `
                                <div class="drink-actions">
                                    <button class="add-btn-single" onclick="addDrinkByIndex(${originalIdx}, '', '${drink.price}')">
                                        <span>+</span> Add to Order
                                    </button>
                                </div>
                            `;
                        }
                    }

                    cardsHtml += `
                        <div class="drink-card">
                            <div class="drink-top">
                                <h3 class="drink-name">${drink.name}</h3>
                                ${priceHtml}
                            </div>
                            ${drink.desc ? `<p class="drink-desc">${drink.desc}</p>` : ''}
                            ${actionsHtml}
                        </div>
                    `;
                });
                cardsHtml += '</div>';

                let bannerHtml = '';
                if (!searchQuery) {
                    const sc = subcatName.toLowerCase();
                    if (sc.includes('signature') || sc.includes('cocktail') || sc.includes('classic') || sc.includes('speciality') || sc.includes('dessert')) {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/ed6cb7fe8ed69395a35a6f99e0f022b4.jpg" alt="Cocktails" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">CRAFT MIXOLOGY</span>
                                    <h3 class="editorial-title">${subcatName}</h3>
                                </div>
                            </div>
                        `;
                    } else if (sc.includes('mocktail')) {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/Mocktails.jpg" alt="Mocktails" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">ZERO PROOF</span>
                                    <h3 class="editorial-title">Mocktails & Refreshers</h3>
                                </div>
                            </div>
                        `;
                    } else if (sc.includes('whiskey')) {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/28c86921ced7dffd814b8e99c725488b.jpg" alt="Whiskey" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">FINE RESERVE</span>
                                    <h3 class="editorial-title">Whiskey & Reserve Liquors</h3>
                                </div>
                            </div>
                        `;
                    } else if (sc.includes('vodka') || sc.includes('gin') || sc.includes('rum') || sc.includes('tequila') || sc.includes('cognac') || sc.includes('spirit')) {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/Vdka.jpg" alt="Spirits" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">PREMIUM SPIRITS</span>
                                    <h3 class="editorial-title">${subcatName}</h3>
                                </div>
                            </div>
                        `;
                    } else if (sc.includes('wine') || sc.includes('rosé') || sc.includes('syrah') || sc.includes('pinotage') || sc.includes('champagne') || sc.includes('sparkling')) {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/Champagne.jpg" alt="Wines & Champagne" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">CELEBRATION</span>
                                    <h3 class="editorial-title">${subcatName}</h3>
                                </div>
                            </div>
                        `;
                    } else if (sc.includes('soft') || sc.includes('juice') || sc.includes('mixer') || sc.includes('energy') || sc.includes('water')) {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/Soft%20drinks.jpg" alt="Beverages" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">BEVERAGES</span>
                                    <h3 class="editorial-title">${subcatName}</h3>
                                </div>
                            </div>
                        `;
                    } else {
                        bannerHtml = `
                            <div class="editorial-banner-card">
                                <img src="https://pub-e10a28ca38cf452da437555e0f90e288.r2.dev/saints%26sinners/Bar%20Menu/05b40712578eccd594e796ea0096306f.jpg" alt="From the Bar" />
                                <div class="editorial-banner-overlay">
                                    <span class="editorial-tag">FROM THE BAR</span>
                                    <h3 class="editorial-title">${subcatName}</h3>
                                </div>
                            </div>
                        `;
                    }
                }

                subSection.innerHTML = bannerHtml + titleHtml + cardsHtml;
                renderTarget.appendChild(subSection);
            });
        }

        // Tab selection events
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = btn.getAttribute('data-category');
                activeSubcategory = 'all';
                renderSubcategoryPills();
                renderMenu();
            });
        });

        // Search input event
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderMenu();
        });

        // Initial Render
        renderSubcategoryPills();
        renderMenu();

        // Ambient Particle Canvas
        (function() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;
            const particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.init();
                }
                init() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.speedX = Math.random() * 0.2 - 0.1;
                    this.speedY = Math.random() * 0.3 - 0.15;
                    this.opacity = Math.random() * 0.35 + 0.08;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                        this.init();
                    }
                }
                draw() {
                    ctx.fillStyle = `rgba(255, 204, 51, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < 35; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
